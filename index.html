button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

#stage{position:absolute;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;overflow-y:auto;
  padding:clamp(20px,6vw,72px);
  transition:transform .4s cubic-bezier(.22,.8,.2,1),opacity .3s ease}
.slide.in-down{transform:translateY(56px);opacity:0}
.slide.in-up{transform:translateY(-56px);opacity:0}
.slide.out-up{transform:translateY(-56px);opacity:0}
.slide.out-down{transform:translateY(56px);opacity:0}
.col{margin:auto;width:min(760px,100%);padding-bottom:64px}
.col.center{text-align:center;display:flex;flex-direction:column;align-items:center}

h1{margin:0;font-weight:500}
.q-title{display:flex;align-items:flex-start;gap:12px;font-size:clamp(23px,4.3vw,32px);line-height:1.25;
  text-shadow:0 1px 14px rgba(0,0,0,.35)}
.num{flex:none;display:inline-grid;place-items:center;min-width:24px;height:24px;margin-top:.32em;padding:0 6px;
  background:#fff;color:#121014;border-radius:6px;font-size:13px;font-weight:700}
.q-desc{margin:10px 0 0;padding-left:36px;font-size:clamp(17px,3vw,21px);line-height:1.45;color:var(--ink-2)}
.q-desc.it{font-style:italic}
.welcome h1{font-size:clamp(36px,8vw,60px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.welcome p{margin:18px 0 0;font-size:clamp(18px,3.2vw,23px);line-height:1.45;color:var(--ink-2);max-width:640px}
.statement .q-title{padding-left:0}
.statement .q-desc{padding-left:0}

.field{display:block;width:calc(100% - 36px);margin:34px 0 0 36px;padding:6px 0 10px;border:0;border-bottom:1px solid var(--line);
  background:transparent;color:#fff;font:inherit;font-size:clamp(24px,4.6vw,32px);outline:none;border-radius:0;resize:none;overflow:hidden}
.field::placeholder{color:rgba(255,255,255,.38)}
.field:focus{border-bottom-color:#fff;box-shadow:0 1px 0 #fff}
.opts{display:flex;flex-direction:column;gap:9px;margin:30px 0 0 36px;max-width:520px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px 11px 12px;text-align:left;
  background:var(--glass);border:1px solid var(--line);border-radius:6px;font-size:clamp(17px,3vw,20px);
  backdrop-filter:blur(2px);transition:background .15s,color .15s,border-color .15s}
.opt:hover{background:var(--glass-2)}
.opt .key{flex:none;display:grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border:1px solid rgba(255,255,255,.75);
  border-radius:4px;font-size:12px;font-weight:600;background:rgba(0,0,0,.25)}
.opt[aria-pressed="true"]{background:#fff;color:#121014;border-color:#fff}
.opt[aria-pressed="true"] .key{background:#121014;color:#fff;border-color:#121014}
.opt[disabled]{opacity:.45;cursor:not-allowed}

.actions{display:flex;align-items:center;gap:14px;margin:26px 0 0 36px;flex-wrap:wrap}
.statement .actions,.welcome .actions{margin-left:0}
.welcome .actions{justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border:0;border-radius:6px;background:#fff;color:#121014;
  font-size:clamp(17px,3vw,20px);font-weight:600}
.btn:hover{background:#ececf1}
.btn.ghost{background:var(--glass);color:#fff;border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{background:var(--glass-2)}
.hint{font-size:14px;color:var(--ink-3)}
.hint b{color:var(--ink-2);font-weight:600}
@media (hover:none){.hint.kbd{display:none}}
.err{margin:16px 0 0 36px;display:inline-block;padding:7px 12px;border-radius:5px;background:rgba(160,20,30,.75);font-size:15px}
.statement .err{margin-left:0}
.meta{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:15px;color:var(--ink-3)}
.org-link{position:absolute;left:clamp(16px,3vw,28px);bottom:clamp(14px,3vw,24px);background:none;border:0;padding:6px 4px;
  font-size:13px;color:rgba(255,255,255,.34);text-decoration:underline;text-underline-offset:3px}
.org-link:hover{color:rgba(255,255,255,.7)}

#hud{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,3vw,28px) calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.prog{display:flex;flex-direction:column;gap:6px;min-width:150px;font-size:13px;color:var(--ink-2)}
.prog .track{height:4px;width:min(200px,42vw);border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:#fff;transition:width .4s ease}
.nav{display:flex;gap:2px}
.nav button{display:grid;place-items:center;width:38px;height:36px;border:0;background:#fff;color:#121014}
.nav button:first-child{border-radius:6px 0 0 6px}
.nav button:last-child{border-radius:0 6px 6px 0}
.nav button:hover{background:#ececf1}
.nav button[disabled]{opacity:.45;cursor:default}

.end h1{font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.end .lead{margin:14px 0 0;font-size:clamp(18px,3vw,22px);line-height:1.45;color:var(--ink-2)}
.score{margin:28px 0 0;font-size:clamp(20px,3.4vw,26px);font-weight:600}

}

<body>
<div class="bg" aria-hidden="true"></div>
<main id="stage" aria-live="polite"></main>
<div id="hud" hidden>
  <div class="prog"><span id="progLabel"></span><div class="track"><i id="progBar"></i></div></div>
  <div class="nav">
    <button type="button" id="btnPrev" aria-label="Question précédente"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l5-5 5 5"/></svg></button>
    <button type="button" id="btnNext" aria-label="Question suivante"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg></button>
  </div>
</div>
<section id="admin" hidden aria-label="Espace organisateur"></section>

<script>
(function(){
'use strict';

/* ---------- Réglages ---------- */
// Renseigne ton contact pour pré-remplir les boutons d'envoi (laisser vide = l'invité choisit le destinataire).
var CONTACT = { whatsapp: '', sms: '', email: '' };
var STORE_KEY = 'gagz-reponses-v1';
var TOTAL_Q = 9;

/* ---------- Contenu ---------- */
var QUIZ = [
  { id:'job', pk:'j', kind:'multi', max:2, short:'Métier de reconversion',
    title:"Quel métier j'aimerais faire si je faisais une reconversion ?", desc:'Deux choix possibles',
    opts:[['modele','Modèle photo'],['styliste','Styliste'],['architecte','Architecte'],['radiologue','Radiologue'],['osteo','Ostéopathe']],
    answer:['styliste','architecte'] },
  { id:'film', pk:'f', kind:'single', short:'Film / saga',
    title:'Le film / la saga que je pourrais revoir indéfiniment.',
    opts:[['intouchables','Intouchables'],['hsm','High School Musical'],['lolfr','LOL France'],['lolus','LOL USA'],['divergente','Divergente']],
    answer:['lolfr'] },
  { id:'faux', pk:'a', kind:'single', short:'Affirmation fausse',
    title:'Quelle affirmation est FAUSSE ?',
    opts:[['gav',"J'ai fait de la GAV"],['riner',"J'ai serré la main de Teddy Riner"],['pleure',"J'ai pleuré au milieu de mon open space"],['toeic',"J'ai eu mon TOEIC"],['ongles',"Je me rongeais les ongles de pied quand j'étais petite"]],
    answer:['toeic'] },
  { id:'bar', pk:'b', kind:'single', short:'Jamais au bar',
    title:'Je ne prends « jamais » au bar :',
    opts:[['coca','Un Coca-Cola'],['rouge','Un verre de vin rouge'],['spritz','Un Spritz'],['pinte','Une pinte'],['rose','Un verre de rosé']],
    answer:['rose'] },
  { id:'sport', pk:'s', kind:'single', short:'Sport pas fait en club',
    title:"Quel sport je n'ai pas fait en club ?",
    opts:[['boxe','Boxe'],['gym','Gym'],['danse','Danse classique'],['tennis','Tennis']],
    answer:['gym'] }
];
var PRESENT_OPTS = [['oui','Oui','O'],['non','Non','N']];

var A = { name:'', present:null, excuse:'', plus1:'', job:[], film:null, faux:null, bar:null, sport:null, mot:'' };

function stepList(){
  var s = [
    { id:'welcome', kind:'welcome' },
    { id:'name', kind:'text', field:'name', required:true,
      title:'Donne-moi ton prénom ma star',
      desc:"J'ai des soucis de mémoire… je réviserai la liste avant le J-J ;)",
      ph:'Écris ta réponse ici…' },
    { id:'present', kind:'single', field:'present', required:true,
      title:'Est-ce que tu seras présent(e) ?', desc:'Trouve-toi une bonne excuse si tu ne peux pas.',
      opts:PRESENT_OPTS }
  ];
  if (A.present === 'non') s.push({ id:'excuse', kind:'long', field:'excuse',
      title:'Donne-moi ton excuse',
      desc:'(Pour tout problème familial ou personnel, je comprends et pas besoin de te justifier)',
      ph:'Écris ta réponse ici…' });
  if (A.present === 'oui') s.push({ id:'plus1', kind:'text', field:'plus1',
      title:'Tu as le droit à ton +1',
      desc:"Merci de ne pas ramener ton date Hinge de la semaine dernière.\nPasse si tu sais que ton +1 a déjà reçu l'invitation ou que t'en as pas.",
      italic:true, ph:'Écris ta réponse ici…' });
  s.push({ id:'statement', kind:'statement',
      title:'Passons aux choses sérieuses, est-ce que tu me connais aussi bien que tu le penses ?',
      desc:'Chaque faute sera étudiée et tu seras puni.', italic:true });
  QUIZ.forEach(function(q){
    s.push({ id:q.id, kind:q.kind, field:q.id, required:true, title:q.title, desc:q.desc || '',
             opts:q.opts.map(function(o,i){ return [o[0],o[1],String.fromCharCode(65+i)]; }), max:q.max });
  });
  s.push({ id:'mot', kind:'text', field:'mot', title:'Un mot doux pour mon anniversaire ?', desc:'',
           ph:'Écris ton mot doux ici…' });
  s.push({ id:'end', kind:'end' });
  return s;
}
function isQuestion(s){ return ['text','long','single','multi'].indexOf(s.kind) !== -1; }

/* ---------- Outils ---------- */
function h(tag, props){
  var el = document.createElement(tag);
  if (props) for (var k in props){
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++){
    var kids = [].concat(arguments[i]);
    for (var j = 0; j < kids.length; j++){
      var c = kids[j];
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(c));
    }
  }
  return el;
}
function $(id){ return document.getElementById(id); }
function b64u(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64u(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function optLabel(q, id){
  for (var i = 0; i < q.opts.length; i++) if (q.opts[i][0] === id) return q.opts[i][1];
  return id || '—';
}
function sameSet(a, b){
  if (!a || a.length !== b.length) return false;
  return b.every(function(x){ return a.indexOf(x) !== -1; });
}
function isCorrect(q, val){
  if (q.kind === 'multi') return sameSet(val, q.answer);
  return val === q.answer[0];
}
function scoreOf(get){
  return QUIZ.reduce(function(n,q){ return n + (isCorrect(q, get(q)) ? 1 : 0); }, 0);
}
function copyText(text, btn, done){
  function ok(){ if (!btn) return; var t = btn.dataset.label || btn.textContent; btn.dataset.label = t; btn.textContent = done || 'Copié ✓'; setTimeout(function(){ btn.textContent = t; }, 1800); }
  function fallback(){
    var ta = h('textarea', { style:'position:fixed;opacity:0;left:-9999px' }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch(e){}
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}

/* ---------- Questionnaire ---------- */
var cur = 'welcome', busy = false, adminOpen = false;
var stage = $('stage');

function idx(){ return stepList().findIndex(function(s){ return s.id === cur; }); }
function stepById(id){ return stepList().filter(function(s){ return s.id === id; })[0]; }
function qNumber(id){
  var n = 0, L = stepList();
  for (var i = 0; i < L.length; i++){ if (isQuestion(L[i])) n++; if (L[i].id === id) return isQuestion(L[i]) ? n : 0; }
  return 0;
}
function qDone(id){
  var n = 0, L = stepList();
  for (var i = 0; i < L.length; i++){ if (L[i].id === id) break; if (isQuestion(L[i])) n++; }
  return n;
}

function descNode(step){
  if (!step.desc) return null;
  var p = h('p', { class:'q-desc' + (step.italic ? ' it' : '') });
  step.desc.split('\n').forEach(function(line, i){ if (i) p.append(document.createElement('br')); p.append(document.createTextNode(line)); });
  return p;
}
function titleNode(step, num){
  return h('h1', { class:'q-title' },
    num ? h('span', { class:'num', text:String(num) }) : null,
    h('span', null, step.title, step.required ? h('span', { class:'req', text:' *' }) : null));
}
function errNode(){ return h('p', { class:'err', role:'alert', hidden:true }); }
function showErr(slide, msg){ var e = slide.querySelector('.err'); if (e){ e.textContent = msg; e.hidden = false; } }
function clearErr(slide){ var e = slide.querySelector('.err'); if (e) e.hidden = true; }

function buildSlide(step){
  var slide = h('section', { class:'slide' }), col, focusEl = null;
  var num = qNumber(step.id);

  if (step.kind === 'welcome'){
    var start = h('button', { class:'btn', type:'button', onclick:next, text:"C'est parti" });
    col = h('div', { class:'col center welcome' },
      h('h1', { text:'Anniversaire de Gagz' }),
      h('p', { text:"Être invité à l'anniversaire de Gagz ça se mérite ! Alors tu dois répondre à quelques questions…" }),
      h('div', { class:'actions' }, start),
      h('span', { class:'meta' }, h('span', { class:'ico', 'aria-hidden':'true' }), 'Environ 2 minutes'));
    col.querySelector('.ico').innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.3 1.5"/></svg>';
    slide.append(col, h('button', { class:'org-link', type:'button', onclick:openAdmin, text:'Espace organisateur' }));
    focusEl = start;
  }
  else if (step.kind === 'text' || step.kind === 'long'){
    var long = step.kind === 'long';
    var f = h(long ? 'textarea' : 'input', { class:'field', placeholder:step.ph, 'aria-label':step.title, autocomplete:'off', maxlength:long ? 1200 : 120 });
    if (long) f.rows = 1; else f.type = 'text';
    f.value = A[step.field] || '';
    function grow(){ if (long){ f.style.height = 'auto'; f.style.height = f.scrollHeight + 'px'; } }
    f.addEventListener('input', function(){ A[step.field] = f.value; clearErr(slide); grow(); });
    col = h('div', { class:'col' }, titleNode(step, num), descNode(step), f, errNode(),
      h('div', { class:'actions' },
        h('button', { class:'btn', type:'button', onclick:next }, 'OK ', h('span', { 'aria-hidden':'true', text:'✓' })),
        h('span', { class:'hint kbd' }, long ? ['Maj ⇧ + Entrée ↵ pour aller à la ligne'] : ['appuie sur ', h('b', { text:'Entrée ↵' })])));
    slide.append(col);
    focusEl = f;
    setTimeout(grow, 0);
  }
  else if (step.kind === 'single' || step.kind === 'multi'){
    var multi = step.kind === 'multi';
    var wrap = h('div', { class:'opts', role:'group', 'aria-label':step.title });
    var btns = step.opts.map(function(o){
      var b = h('button', { class:'opt', type:'button', 'aria-pressed':'false', 'data-key':o[2], 'data-id':o[0] },
        h('span', { class:'key', text:o[2] }), h('span', { text:o[1] }));
      b.addEventListener('click', function(){ choose(o[0]); });
      wrap.append(b); return b;
    });
    var sel = function(){ return multi ? A[step.field] : [A[step.field]]; };
    function paint(){
      var s = sel();
      btns.forEach(function(b){
        var on = s.indexOf(b.dataset.id) !== -1;
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.disabled = multi && !on && s.length >= step.max;
      });
    }
    function choose(id){
      clearErr(slide);
      if (multi){
        var arr = A[step.field], i = arr.indexOf(id);
        if (i !== -1) arr.splice(i,1); else if (arr.length < step.max) arr.push(id);
        paint();
      } else {
        A[step.field] = id; paint();
        setTimeout(function(){ if (cur === step.id) next(); }, 380);
      }
    }
    paint();
    col = h('div', { class:'col' }, titleNode(step, num), descNode(step), wrap, errNode(),
      multi ? h('div', { class:'actions' },
        h('button', { class:'btn', type:'button', onclick:next }, 'OK ', h('span', { 'aria-hidden':'true', text:'✓' })),
        h('span', { class:'hint kbd' }, ['appuie sur ', h('b', { text:'Entrée ↵' })])) : null);
    slide.append(col);
  }
  else if (step.kind === 'statement'){
    var go = h('button', { class:'btn', type:'button', onclick:next, text:'Continuer' });
    col = h('div', { class:'col statement' }, titleNode(step, 0), descNode(step),
      h('div', { class:'actions' }, go, h('span', { class:'hint kbd' }, ['appuie sur ', h('b', { text:'Entrée ↵' })])));
    slide.append(col);
    focusEl = go;
  }
  else if (step.kind === 'end'){
    slide.append(buildEnd());
  }
  slide._focus = focusEl;
  return slide;
}

function verdict(n){
  if (n === 5) return 'Sans faute. Tu mérites ta place.';
  if (n === 4) return 'Une seule faute. Tu es sur la liste, mais sous surveillance.';
  if (n === 3) return 'Trois sur cinq. Ton dossier sera réexaminé avant le J-J.';
  return "Aïe. Le jury étudie encore ton cas.";
}
function payload(){
  var o = { v:1, n:A.name.trim(), p:A.present, e:A.excuse.trim(), x:A.plus1.trim(), m:A.mot.trim() };
  QUIZ.forEach(function(q){ o[q.pk] = A[q.id]; });
  return o;
}
function buildMessage(){
  var sc = scoreOf(function(q){ return A[q.id]; });
  var L = ['Anniversaire de Gagz : mes réponses', '', 'Prénom : ' + A.name.trim(), 'Présence : ' + (A.present === 'oui' ? 'Oui' : 'Non')];
  if (A.present === 'non' && A.excuse.trim()) L.push('Excuse : ' + A.excuse.trim());
  if (A.present === 'oui' && A.plus1.trim()) L.push('+1 : ' + A.plus1.trim());
  L.push('', 'Quiz : ' + sc + '/5');
  QUIZ.forEach(function(q){
    var v = A[q.id];
    var txt = q.kind === 'multi' ? (v.map(function(id){ return optLabel(q, id); }).join(', ') || '—') : optLabel(q, v);
    L.push(q.short + ' : ' + txt);
  });
  if (A.mot.trim()) L.push('', 'Mot doux : ' + A.mot.trim());
  L.push('', 'Code : GZ1.' + b64u(JSON.stringify(payload())));
  return L.join('\n');
}
function buildEnd(){
  var sc = scoreOf(function(q){ return A[q.id]; });
  var msg = buildMessage(), enc = encodeURIComponent(msg);
  var name = A.name.trim() || 'toi';
  var faults = QUIZ.filter(function(q){ return !isCorrect(q, A[q.id]); }).map(function(q){
    return h('li', null, h('b', { text:q.short }), ' : bonne réponse, ' + q.answer.map(function(id){ return optLabel(q,id); }).join(' + '));
  });
  var wa = 'https://wa.me/' + (CONTACT.whatsapp || '') + '?text=' + enc;
  var sms = 'sms:' + (CONTACT.sms || '') + '?body=' + enc;
  var mail = 'mailto:' + (CONTACT.email || '') + '?subject=' + encodeURIComponent('Anniversaire de Gagz : mes réponses') + '&body=' + enc;
  var copyBtn = h('button', { class:'btn ghost', type:'button', text:'Copier mon message' });
  copyBtn.addEventListener('click', function(){ copyText(msg, copyBtn); });
  return h('div', { class:'col end' },
    h('h1', { text:'Merci ' + name + ' !' }),
    h('p', { class:'lead', text: A.present === 'oui' ? "Ta place est presque réservée." : "Dommage, tu vas nous manquer." }),
    h('p', { class:'score' }, 'Ton score : ' + sc + '/5', h('span', { text:verdict(sc) })),
    faults.length ? h('ul', { class:'faults' }, faults) : null,
    h('div', { class:'send' },
      h('h2', { text:'Dernière étape : envoie-moi tes réponses' }),
      h('p', { text:"Tes réponses ne sont enregistrées que si tu me les envoies. Choisis le moyen le plus simple :" }),
      h('div', { class:'row' },
        h('a', { class:'btn', href:wa, target:'_blank', rel:'noopener', text:'WhatsApp' }),
        h('a', { class:'btn', href:sms, text:'SMS' }),
        h('a', { class:'btn', href:mail, text:'E-mail' }),
        copyBtn),
      h('p', { class:'fine', text:"Si rien ne s'ouvre, copie ton message et envoie-le-moi où tu veux. Ne modifie pas la ligne « Code »." })));
}

function updateHud(){
  var s = stepById(cur), show = s && s.kind !== 'welcome' && s.kind !== 'end';
  $('hud').hidden = !show;
  if (!show) return;
  var d = qDone(cur), n = isQuestion(s) ? d + 1 : d;
  $('progLabel').textContent = Math.min(n, TOTAL_Q) + ' sur ' + TOTAL_Q;
  $('progBar').style.width = Math.round(d / TOTAL_Q * 100) + '%';
  $('btnPrev').disabled = idx() <= 1;
}

function show(id, dir, instant){
  if (busy) return;
  var old = stage.querySelector('.slide');
  cur = id;
  var step = stepById(id), slide = buildSlide(step);
  if (instant || !old){
    stage.textContent = ''; stage.append(slide);
  } else {
    busy = true;
    slide.classList.add(dir === 'down' ? 'in-down' : 'in-up');
    stage.append(slide);
    void slide.offsetWidth;
    slide.classList.remove('in-down', 'in-up');
    old.classList.add(dir === 'down' ? 'out-up' : 'out-down');
    setTimeout(function(){ old.remove(); busy = false; }, 420);
  }
  updateHud();
  setTimeout(function(){ if (slide._focus) slide._focus.focus({ preventScroll:true }); }, instant || !old ? 0 : 200);
}

function validate(step){
  var slide = stage.querySelector('.slide:last-child');
  if (!step.required) return true;
  if (step.kind === 'text' || step.kind === 'long'){
    if (!A[step.field].trim()){ showErr(slide, 'Oups ! Merci de répondre à cette question.'); return false; }
  } else if (step.kind === 'single'){
    if (!A[step.field]){ showErr(slide, 'Oups ! Choisis une réponse.'); return false; }
  } else if (step.kind === 'multi'){
    if (!A[step.field].length){ showErr(slide, 'Oups ! Choisis au moins une réponse.'); return false; }
  }
  return true;
}
function next(){
  if (busy || adminOpen) return;
  var L = stepList(), i = idx(), step = L[i];
  if (!step || step.kind === 'end') return;
  if (!validate(step)) return;
  if (i < L.length - 1) show(L[i+1].id, 'down');
}
function prev(){
  if (busy || adminOpen) return;
  var L = stepList(), i = idx();
  if (i > 1) show(L[i-1].id, 'up');
}
$('btnPrev').addEventListener('click', prev);
$('btnNext').addEventListener('click', next);

document.addEventListener('keydown', function(e){
  if (adminOpen || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target, tag = t && t.tagName, s = stepById(cur);
  if (!s) return;
  if (e.key === 'Enter'){
    if (tag === 'BUTTON' || tag === 'A') return;
    if (tag === 'TEXTAREA' && e.shiftKey) return;
    e.preventDefault(); next(); return;
  }
  if ((s.kind === 'single' || s.kind === 'multi') && tag !== 'INPUT' && tag !== 'TEXTAREA' && e.key.length === 1){
    var k = e.key.toUpperCase();
    var b = stage.querySelector('.slide:last-child .opt[data-key="' + k + '"]');
    if (b && !b.disabled){ e.preventDefault(); b.click(); }
  }
});

/* ---------- Espace organisateur ---------- */
var rows = loadRows();
function loadRows(){
  try { var r = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); return Array.isArray(r) ? r : []; } catch(e){ return []; }
}
function saveRows(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(rows)); } catch(e){} }
function rowScore(d){ return scoreOf(function(q){ return d[q.pk]; }); }
function ingest(text){
  var tokens = text.match(/GZ1\.[A-Za-z0-9_-]+/g) || [];
  var r = { found:tokens.length, added:0, dup:0, bad:0 };
  tokens.forEach(function(t){
    if (rows.some(function(x){ return x.t === t; })){ r.dup++; return; }
    try {
      var d = JSON.parse(unb64u(t.slice(4)));
      if (!d || d.v !== 1 || (d.p !== 'oui' && d.p !== 'non')) throw new Error('format');
      rows.push({ t:t, d:d }); r.added++;
    } catch(e){ r.bad++; }
  });
  saveRows();
  return r;
}
function tsv(){
  var head = ['Prénom','Présence','Excuse','+1','Score /5'].concat(QUIZ.map(function(q){ return q.short; }), ['Mot doux']);
  var clean = function(v){ return String(v == null ? '' : v).replace(/[\t\r\n]+/g,' '); };
  var lines = [head.join('\t')];
  rows.forEach(function(r){
    var d = r.d;
    lines.push([d.n, d.p === 'oui' ? 'Oui' : 'Non', d.e, d.x, rowScore(d)].concat(
      QUIZ.map(function(q){ return q.kind === 'multi' ? (d[q.pk] || []).map(function(id){ return optLabel(q,id); }).join(' + ') : optLabel(q, d[q.pk]); }),
      [d.m]).map(clean).join('\t'));
  });
  return lines.join('\n');
}
function td(text, cls){ return h('td', { class:cls || null, text:text == null ? '' : String(text) }); }

function renderAdmin(status){
  var root = $('admin'); root.textContent = '';
  var n = rows.length, oui = rows.filter(function(r){ return r.d.p === 'oui'; }).length;
  var avg = n ? (rows.reduce(function(a,r){ return a + rowScore(r.d); }, 0) / n) : 0;

  var ta = h('textarea', { placeholder:'Colle ici les messages reçus (WhatsApp, SMS, e-mail). Tu peux en coller plusieurs d\'un coup.', 'aria-label':'Messages reçus' });
  var st = h('span', { class:'status', role:'status', text:status || '' });
  var add = h('button', { class:'btn', type:'button', text:'Ajouter au tableau' });
  add.addEventListener('click', function(){
    if (!ta.value.trim()) return;
    var r = ingest(ta.value);
    if (!r.found){ st.textContent = 'Aucun code trouvé : colle le message en entier, avec la ligne « Code ».'; return; }
    var parts = [r.added + ' ajoutée' + (r.added > 1 ? 's' : '')];
    if (r.dup) parts.push(r.dup + ' déjà présente' + (r.dup > 1 ? 's' : ''));
    if (r.bad) parts.push(r.bad + ' illisible' + (r.bad > 1 ? 's' : '') + ' (code coupé ?)');
    renderAdmin(parts.join(', ') + '.');
  });

  var head = h('div', null,
    h('button', { class:'btn ghost', type:'button', onclick:closeAdmin, text:'← Retour au questionnaire' }),
    h('h1', { style:'margin-top:26px', text:'Réponses à l\'anniversaire' }),
    h('p', { text:"Les réponses arrivent par message. Colle-les ici : elles sont décodées et comptées. Le tableau est gardé dans ce navigateur, sur cet appareil." }),
    ta, h('div', { class:'bar-row' }, add, st));

  var stats = h('div', { class:'stats' },
    h('div', null, h('b', { text:String(n) }), 'réponse' + (n > 1 ? 's' : '')),
    h('div', null, h('b', { text:String(oui) }), 'présent(e)s'),
    h('div', null, h('b', { text:String(n - oui) }), 'absent(e)s'),
    h('div', null, h('b', { text:n ? avg.toFixed(1).replace('.', ',') + '/5' : '–' }), 'score moyen'));

  var tbl;
  if (!n){
    tbl = h('p', { class:'empty', text:'Aucune réponse pour le moment.' });
  } else {
    var tb = h('tbody');
    rows.forEach(function(r, i){
      var d = r.d;
      var del = h('button', { class:'x-btn', type:'button', 'aria-label':'Supprimer la réponse de ' + (d.n || 'cette personne'), text:'×' });
      del.addEventListener('click', function(){ rows.splice(i,1); saveRows(); renderAdmin('Réponse supprimée.'); });
      tb.append(h('tr', null, td(d.n), td(d.p === 'oui' ? 'Oui' : 'Non'), td(rowScore(d) + '/5', 'num-c'),
        td(d.x, 'wide'), td(d.e, 'wide'), td(d.m, 'wide'), h('td', null, del)));
    });
    tbl = h('div', { class:'tablewrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', { text:'Prénom' }), h('th', { text:'Présence' }), h('th', { class:'num-c', text:'Score' }),
        h('th', { text:'+1' }), h('th', { text:'Excuse' }), h('th', { text:'Mot doux' }), h('th', { text:'' }))), tb));
  }

  var copyAll = h('button', { class:'btn ghost', type:'button', text:'Copier le tableau (Excel, Sheets)' });
  copyAll.addEventListener('click', function(){ if (n) copyText(tsv(), copyAll); });
  var wipe = h('button', { class:'btn ghost', type:'button', text:'Tout effacer' }), armed = false;
  wipe.addEventListener('click', function(){
    if (!n) return;
    if (!armed){ armed = true; wipe.textContent = 'Confirmer l\'effacement'; setTimeout(function(){ armed = false; wipe.textContent = 'Tout effacer'; }, 3500); return; }
    rows = []; saveRows(); renderAdmin('Tableau vidé.');
  });

  var counts = h('div');
  // Présence
  var blkP = h('div', { class:'q-block' }, h('h3', null, 'Présence'));
  blkP.append(countTable([['Oui', oui, false], ['Non', n - oui, false]], n));
  counts.append(blkP);
  // Quiz
  QUIZ.forEach(function(q){
    var c = {}; q.opts.forEach(function(o){ c[o[0]] = 0; });
    rows.forEach(function(r){
      var v = r.d[q.pk];
      (q.kind === 'multi' ? (v || []) : [v]).forEach(function(id){ if (c[id] != null) c[id]++; });
    });
    var good = rows.filter(function(r){ return isCorrect(q, r.d[q.pk]); }).length;
    var blk = h('div', { class:'q-block' }, h('h3', null, q.short, h('span', { class:'sub', text: good + ' bonne' + (good > 1 ? 's' : '') + ' réponse' + (good > 1 ? 's' : '') + (q.kind === 'multi' ? ' (les deux justes)' : '') })));
    blk.append(countTable(q.opts.map(function(o){ return [o[1], c[o[0]], q.answer.indexOf(o[0]) !== -1]; }), n));
    counts.append(blk);
  });
  // Distribution des scores
  var dist = [0,0,0,0,0,0]; rows.forEach(function(r){ dist[rowScore(r.d)]++; });
  var blkS = h('div', { class:'q-block' }, h('h3', null, 'Répartition des scores'));
  blkS.append(countTable(dist.map(function(v,i){ return [i + '/5', v, false]; }).reverse(), n));
  counts.append(blkS);

  root.append(h('div', { class:'wrap' }, head, stats,
    h('h2', null, 'Tableau des réponses'), tbl,
    h('div', { class:'bar-row' }, copyAll, wipe),
    h('h2', null, 'Comptage par question'), counts));
}
function countTable(list, total){
  var tb = h('tbody');
  list.forEach(function(it){
    var pct = total ? Math.round(it[1] / total * 100) : 0;
    tb.append(h('tr', null,
      h('td', null, it[0], it[2] ? h('span', { class:'tick', text:'  ✓' }) : null),
      td(it[1], 'num-c'), td(pct + ' %', 'num-c'),
      h('td', { style:'width:34%' }, h('div', { class:'meter' + (it[2] ? ' good' : '') }, h('i', { style:'width:' + pct + '%' })))));
  });
  return h('div', { class:'tablewrap' }, h('table', null, tb));
}
function openAdmin(){
  adminOpen = true; $('hud').hidden = true; $('admin').hidden = false;
  renderAdmin(); $('admin').scrollTop = 0;
  try { history.replaceState(null, '', '#organisateur'); } catch(e){}
}
function closeAdmin(){
  adminOpen = false; $('admin').hidden = true;
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  updateHud();
}

show('welcome', 'down', true);
if (location.hash === '#organisateur') openAdmin();
window.addEventListener('hashchange', function(){ if (location.hash === '#organisateur' && !adminOpen) openAdmin(); });
})();
</script>
</body>
